name = "eduadmin-ai-worker"
main = "src/index.ts"
compatibility_date = "2024-06-01"
workers_dev = true

# GEMINI_API_KEY is a secret, not a plaintext var — set it with:
#   npx wrangler secret put GEMINI_API_KEY
# (paste your Google AI Studio key when prompted).
#
# Deploy:
#   cd worker && npm install && npm run deploy
#
# Local dev:
#   cd worker && npm run dev
