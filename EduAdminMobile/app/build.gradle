plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.eduadmin.pro'
    compileSdk 34

    defaultConfig {
        applicationId "com.eduadmin.pro"
        minSdk 26           // EncryptedSharedPreferences + modern USB APIs
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables { useSupportLibrary true }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    packaging {
        resources { excludes += '/META-INF/{AL2.0,LGPL2.1}' }
    }

    // Room schema export directory
    kapt {
        arguments {
            arg("room.schemaLocation", "$projectDir/schemas")
        }
    }
}

dependencies {

    // ── Compose BOM (pins all androidx.compose.* versions in sync) ─────────
    def composeBom = platform('androidx.compose:compose-bom:2024.02.00')
    implementation composeBom
    androidTestImplementation composeBom

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // ── Core AndroidX ────────────────────────────────────────────────────────
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'

    // ── Compose Navigation 2.7.7 ─────────────────────────────────────────────
    implementation 'androidx.navigation:navigation-compose:2.7.7'

    // ── Retrofit 2.9.0 + OkHttp ─────────────────────────────────────────────
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // ── Supabase Android SDK ─────────────────────────────────────────────────
    // Explicit versions — avoids BOM resolution issues in Groovy DSL.
    implementation 'io.github.jan-tennert.supabase:auth-kt:2.6.1'
    implementation 'io.github.jan-tennert.supabase:postgrest-kt:2.6.1'
    implementation 'io.github.jan-tennert.supabase:storage-kt:2.6.1'

    // Ktor OkHttp engine — supabase-kt 2.6.1 requires Ktor 2.3.x
    implementation 'io.ktor:ktor-client-okhttp:2.3.12'

    // ── Room 2.6.1 ───────────────────────────────────────────────────────────
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    // ── WorkManager 2.9.0 ────────────────────────────────────────────────────
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    // ── Encrypted SharedPreferences 1.1.0-alpha06 ────────────────────────────
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // ── Coil 2.6.0 (async image loading + shimmer avatar placeholders) ───────
    implementation 'io.coil-kt:coil-compose:2.6.0'

    // ── Testing ──────────────────────────────────────────────────────────────
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
}
